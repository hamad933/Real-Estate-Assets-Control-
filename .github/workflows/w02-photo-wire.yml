name: W02 photo wiring cleanup

on:
  push:
    branches:
      - feature/rp04-imp-w02-public-discovery-inquiry

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout W02 branch
        uses: actions/checkout@v4
        with:
          ref: feature/rp04-imp-w02-public-discovery-inquiry
          fetch-depth: 0

      - name: Wire authorized photography into W02 only
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('components/public/PublicExperience.tsx')
          text = path.read_text()
          replacements = [
              ('import { PropertyVisual } from "@/components/PropertyVisual";', 'import { PropertyPhoto } from "./PropertyPhoto";'),
              ('<PropertyVisual compact label={`تصوير تمثيلي لـ ${property.title}`} />', '<PropertyPhoto propertyId={property.id} alt={`صورة عقارية لـ ${property.title}`} />'),
              ('<PropertyVisual label="واجهة تمثيلية لعقار سكني معاصر" />', '<PropertyPhoto variant="hero" alt="واجهة سكنية معاصرة بإضاءة دافئة" />'),
              ('<div className={styles.galleryMain}><PropertyVisual label={`الصورة الرئيسية التمثيلية لـ ${property.title}`} /></div>', '<div className={styles.galleryMain}><PropertyPhoto propertyId={property.id} alt={`الصورة الرئيسية لـ ${property.title}`} /></div>'),
              ('<div className={styles.gallerySmall}><PropertyVisual compact label="زاوية داخلية تمثيلية" /><PropertyVisual compact label="زاوية إضافية تمثيلية" /></div>', '<div className={styles.gallerySmall}><PropertyPhoto propertyId={property.id} variant="secondary" alt={`صورة سكنية إضافية لـ ${property.title}`} /><PropertyPhoto propertyId={property.id} variant="tertiary" alt={`صورة سكنية إضافية ثانية لـ ${property.title}`} /></div>'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count == 0:
                  raise SystemExit(f'missing expected W02 visual token: {old[:70]}')
              text = text.replace(old, new)
          if 'PropertyVisual' in text:
              raise SystemExit('generic PropertyVisual remains in W02 PublicExperience')
          path.write_text(text)

          css_path = Path('components/public/PublicExperience.module.css')
          css = css_path.read_text()
          marker = '/* W02 authorized property photography */'
          if marker not in css:
              css += '''\n\n/* W02 authorized property photography */\n.heroImage > [data-testid="property-photo"],\n.cardVisual > [data-testid="property-photo"],\n.summaryVisual > [data-testid="property-photo"] {\n  width: 100%;\n  height: 100%;\n}\n.galleryMain > [data-testid="property-photo"] {\n  min-height: 430px;\n}\n.gallerySmall > [data-testid="property-photo"] {\n  min-height: 0;\n  height: 100%;\n}\n.compareCard > [data-testid="property-photo"] {\n  width: 100%;\n  height: 150px;\n  padding: 0 !important;\n}\n@media (max-width: 820px) {\n  .galleryMain > [data-testid="property-photo"] {\n    min-height: 270px;\n  }\n}\n'''
          css_path.write_text(css)
          PY

      - name: Remove temporary wiring workflow
        run: rm .github/workflows/w02-photo-wire.yml

      - name: Commit bounded visual-fidelity wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: use authorized photography across W02 public surfaces"
          git push origin HEAD:feature/rp04-imp-w02-public-discovery-inquiry
