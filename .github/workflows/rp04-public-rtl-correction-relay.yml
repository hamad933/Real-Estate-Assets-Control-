name: RP04 public RTL correction relay

on:
  push:
    branches:
      - fix/rp04-map-pin-readability-20260827

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rp04-map-pin-readability-20260827
          fetch-depth: 0
      - name: Apply exact bounded RTL corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/public/PublicExperience.module.css')
          s = p.read_text()
          replacements = {
            '  direction: ltr;\n  align-items: center;\n  justify-content: space-between;': '  direction: rtl;\n  flex-direction: row-reverse;\n  align-items: center;\n  justify-content: space-between;',
            '.searchLayout { display: grid; direction: ltr; grid-template-columns: minmax(0,1fr) 285px; gap: 24px; align-items: start; }': '.searchLayout { display: grid; direction: rtl; grid-template-columns: 285px minmax(0,1fr); gap: 24px; align-items: start; }',
            '.resultList, .shortlistRail { direction: rtl; }': '.resultList, .shortlistRail { direction: rtl; }\n.resultList { grid-column: 2; }\n.shortlistRail { grid-column: 1; }',
            '.mapWorkspace { height: 720px; display: grid; direction: ltr; grid-template-columns: minmax(0,1.35fr) minmax(350px,.65fr); gap: 14px; }': '.mapWorkspace { height: 720px; display: grid; direction: rtl; grid-template-columns: minmax(350px,.65fr) minmax(0,1.35fr); gap: 14px; }',
            '.mapCanvas, .mapList { direction: rtl; }': '.mapCanvas, .mapList { direction: rtl; }\n.mapCanvas { grid-column: 2; }\n.mapList { grid-column: 1; }',
            '.detailGallery { min-width: 0; display: grid; grid-template-columns: 1fr 180px; gap: 10px; direction: ltr; }': '.detailGallery { min-width: 0; display: grid; grid-template-columns: 180px 1fr; gap: 10px; direction: rtl; }',
            '.galleryMain { min-height: 430px; }': '.galleryMain { min-height: 430px; grid-column: 2; }',
            '.gallerySmall { display: grid; grid-template-rows: 1fr 1fr; gap: 10px; min-width: 0; }': '.gallerySmall { display: grid; grid-column: 1; grid-template-rows: 1fr 1fr; gap: 10px; min-width: 0; }',
            '.inquiryLayout { display: grid; direction: ltr; grid-template-columns: minmax(0,1fr) 330px; gap: 25px; align-items: start; }': '.inquiryLayout { display: grid; direction: rtl; grid-template-columns: 330px minmax(0,1fr); gap: 25px; align-items: start; }',
            '.inquiryForm, .inquirySummary { direction: rtl; }': '.inquiryForm, .inquirySummary { direction: rtl; }\n.inquiryForm { grid-column: 2; }\n.inquirySummary { grid-column: 1; }',
            '  .searchLayout { grid-template-columns: minmax(0,1fr) 250px; }': '  .searchLayout { grid-template-columns: 250px minmax(0,1fr); }',
            '  .searchLayout { grid-template-columns: 1fr; }': '  .searchLayout { grid-template-columns: 1fr; }\n  .resultList, .shortlistRail { grid-column: auto; }',
            '  .mapWorkspace { height: auto; grid-template-columns: 1fr; }': '  .mapWorkspace { height: auto; grid-template-columns: 1fr; }\n  .mapCanvas, .mapList { grid-column: auto; }',
            '  .detailGallery { grid-template-columns: 1fr 140px; }': '  .detailGallery { grid-template-columns: 140px 1fr; }',
            '  .inquiryLayout { grid-template-columns: 1fr; }': '  .inquiryLayout { grid-template-columns: 1fr; }\n  .inquiryForm, .inquirySummary { grid-column: auto; }',
            '  .detailGallery { grid-template-columns: 1fr; }': '  .detailGallery { grid-template-columns: 1fr; }\n  .galleryMain, .gallerySmall { grid-column: auto; }',
            '  .heroCaption { left: 12px; bottom: 12px; min-width: 190px; padding: 10px 12px; }': '  .heroCaption { inset-inline-start: 12px; bottom: 12px; min-width: 190px; padding: 10px 12px; }',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected source fragment: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          cat > tests/rtl-layout-regression.spec.ts <<'EOF'
          import { expect, test } from "@playwright/test";

          async function expectRtl(page: import("@playwright/test").Page, locator: string) {
            const element = page.locator(locator).first();
            await expect(element).toBeVisible();
            expect(await element.evaluate((node) => getComputedStyle(node).direction)).toBe("rtl");
          }

          test("public structural layouts remain semantically RTL without physical hero offset", async ({ page }) => {
            await page.setViewportSize({ width: 1440, height: 1000 });

            await page.goto("/");
            await expectRtl(page, "header > div");

            await page.goto("/search?district=all&type=all&budget=all&availability=all");
            const resultSection = page.locator('section[aria-label="نتائج العقارات"]');
            await expect(resultSection).toBeVisible();
            expect(await resultSection.evaluate((node) => getComputedStyle(node.parentElement!).direction)).toBe("rtl");

            await page.goto("/map");
            const mapSection = page.locator('section[aria-label="خريطة العقارات"]');
            await expect(mapSection).toBeVisible();
            expect(await mapSection.evaluate((node) => getComputedStyle(node.parentElement!).direction)).toBe("rtl");

            await page.setViewportSize({ width: 390, height: 844 });
            await page.goto("/");
            const caption = page.getByText("خيار مميز").locator("..");
            const logicalStart = await caption.evaluate((node) => getComputedStyle(node).insetInlineStart);
            expect(logicalStart).toBe("12px");
          });
          EOF

          rm .github/workflows/rp04-public-rtl-correction-relay.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add components/public/PublicExperience.module.css tests/rtl-layout-regression.spec.ts .github/workflows/rp04-public-rtl-correction-relay.yml
          git commit -m 'RP04: correct public RTL layout semantics'
          git push origin HEAD:fix/rp04-map-pin-readability-20260827
