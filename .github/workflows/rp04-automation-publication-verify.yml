name: RP04 Automation Publication Verify
on:
  workflow_dispatch:
    inputs:
      request_json:
        description: Strict public-safe publication verification request JSON
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      REQUEST_JSON: ${{ inputs.request_json }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Require secret without printing it
        run: test -n "${JULES_API_KEY:-}"
      - name: Materialize public-safe request
        run: |
          python - <<'PY'
          import os
          open('/tmp/rp04-publication.json','w',encoding='utf-8').write(os.environ['REQUEST_JSON'])
          PY
      - name: Verify exact Jules patch and publication preconditions without mutation
        run: python -m tools.rp04_automation.publication_cli /tmp/rp04-publication.json --output-dir /tmp/rp04-publication-evidence
      - name: Verify patch applies cleanly to exact reviewed base without mutation
        run: |
          set -euo pipefail
          BASE_SHA="$(python - <<'PY'
          import json,re
          p=json.load(open('/tmp/rp04-publication-evidence/publication_verification.json',encoding='utf-8'))
          sha=str(p.get('base_sha',''))
          if not re.fullmatch(r'[0-9a-f]{40}',sha): raise SystemExit('invalid verified base sha')
          print(sha)
          PY
          )"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git checkout --detach "$BASE_SHA"
          git apply --check /tmp/rp04-publication-evidence/reviewed.patch
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rp04-publication-verify-${{ github.run_id }}
          path: /tmp/rp04-publication-evidence/
          if-no-files-found: error
          retention-days: 30
