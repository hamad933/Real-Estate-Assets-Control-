name: RP04 candidate correction validation

on:
  pull_request:
    branches:
      - feature/rp04-imp-w08-human-grade-portfolio-polish
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  validate:
    name: exact-head-candidate-correction-regression
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RP04_DB_PATH: ${{ github.workspace }}/.runtime/rp04-ci.sqlite

    steps:
      - name: Checkout exact correction head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact PR head and candidate ancestry
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          test "$ACTUAL_HEAD" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$EXPECTED_BASE" "$ACTUAL_HEAD"
          mkdir -p evidence/candidate-correction
          printf '%s\n' "$ACTUAL_HEAD" > evidence/candidate-correction/validated-head-sha.txt
          printf '%s\n' "$EXPECTED_BASE" > evidence/candidate-correction/base-sha.txt
          git diff --name-only "$EXPECTED_BASE" "$ACTUAL_HEAD" | sort > evidence/candidate-correction/changed-paths.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install exact lockfile dependencies
        run: npm ci

      - name: Audit high severity dependencies
        run: npm audit --audit-level=high

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Verify production-mode Playwright server
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'npm run start' playwright.config.ts
          if grep -q 'npm run dev' playwright.config.ts; then
            echo 'Development-mode Playwright server is forbidden for governed candidate evidence.' >&2
            exit 1
          fi

      - name: Reset deterministic database
        run: npm run db:reset

      - name: Verify database coherence
        run: npm run db:verify

      - name: Full exact-head Playwright regression
        run: npm run test:e2e

      - name: Build exact-head evidence manifest
        if: always()
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mkdir -p evidence/candidate-correction
          printf '%s\n' "$(git rev-parse HEAD)" > evidence/candidate-correction/final-head-sha.txt
          find evidence/screenshots -type f -name '*.png' -print 2>/dev/null | sort > evidence/candidate-correction/screenshot-index.txt || true
          if [ -s evidence/candidate-correction/screenshot-index.txt ]; then
            xargs -d '\n' sha256sum < evidence/candidate-correction/screenshot-index.txt > evidence/candidate-correction/screenshot-sha256.txt
          else
            : > evidence/candidate-correction/screenshot-sha256.txt
          fi
          {
            echo "workflow=RP04 candidate correction validation"
            echo "head=$(git rev-parse HEAD)"
            echo "expected_head=$EXPECTED_HEAD"
            echo "base=$EXPECTED_BASE"
            echo "screenshots=$(wc -l < evidence/candidate-correction/screenshot-index.txt | tr -d ' ')"
          } > evidence/candidate-correction/manifest.txt

      - name: Upload exact-head correction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rp04-candidate-correction-evidence-${{ github.event.pull_request.number }}-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            evidence/candidate-correction
            evidence/screenshots
            playwright-report
            test-results
            package.json
            package-lock.json
