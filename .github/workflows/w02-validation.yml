name: W02 validation

on:
  pull_request:
    branches:
      - feature/rp04-imp-w01-app-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: exact-head-public-journey
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'feature/rp04-imp-w02-public-discovery-inquiry'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout exact PR head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout dispatched ref
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify exact validated SHA
        env:
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_HEAD_SHA="$(git rev-parse HEAD)"
          echo "Expected head SHA: ${EXPECTED_HEAD_SHA}"
          echo "Validated head SHA: ${ACTUAL_HEAD_SHA}"
          test "${ACTUAL_HEAD_SHA}" = "${EXPECTED_HEAD_SHA}"
          mkdir -p evidence
          printf '%s\n' "${ACTUAL_HEAD_SHA}" > evidence/w02-validated-head-sha.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies from committed lockfile
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Playwright full regression and W02 journey
        run: npm run test:e2e

      - name: Upload W02 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rp04-w02-evidence
          if-no-files-found: warn
          path: |
            evidence/w02-validated-head-sha.txt
            evidence/screenshots/w02
            playwright-report
            test-results
