name: RP04 Automation Mutation Router

on:
  workflow_dispatch:
    inputs:
      request_json:
        description: Strict public-safe RP04 automation request JSON
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  transport-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require repository owner and governed default branch
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$ACTOR" = "$OWNER"
          test "$REF" = "refs/heads/main"

  normalize:
    needs: transport-gate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      request_json: ${{ steps.route.outputs.request_json }}
      request_key: ${{ steps.route.outputs.request_key }}
      effect_key: ${{ steps.route.outputs.effect_key }}
      operation_kind: ${{ steps.route.outputs.operation_kind }}
    env:
      REQUEST_JSON: ${{ inputs.request_json }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: route
        name: Strictly normalize and derive deterministic identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from tools.rp04_automation.gateway import canonical_json, normalize_request
          req = json.loads(os.environ['REQUEST_JSON'])
          n = normalize_request(req)
          if n['operation_kind'] == 'READ':
              raise SystemExit('read action must use shadow inspect workflow')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write('request_json=' + canonical_json(n) + '\n')
              f.write('request_key=' + n['request_key'] + '\n')
              f.write('effect_key=' + n['effect_key'] + '\n')
              f.write('operation_kind=' + n['operation_kind'] + '\n')
          PY

  request-serialized-worker:
    needs: normalize
    concurrency:
      group: rp04-automation-request-${{ needs.normalize.outputs.request_key }}
      cancel-in-progress: false
    uses: ./.github/workflows/rp04-automation-mutation-worker.yml
    with:
      request_json: ${{ needs.normalize.outputs.request_json }}
      effect_key: ${{ needs.normalize.outputs.effect_key }}
      operation_kind: ${{ needs.normalize.outputs.operation_kind }}
    secrets:
      JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
