name: W01 lockfile bootstrap

on:
  pull_request:
    branches:
      - governance/rp04-gov-init-001

permissions:
  contents: write

jobs:
  bootstrap-lockfile:
    if: github.event.pull_request.head.ref == 'feature/rp04-imp-w01-app-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact bootstrap head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ACTUAL_HEAD_SHA="$(git rev-parse HEAD)"
          echo "Expected bootstrap SHA: ${EXPECTED_HEAD_SHA}"
          echo "Checked out bootstrap SHA: ${ACTUAL_HEAD_SHA}"
          test "${ACTUAL_HEAD_SHA}" = "${EXPECTED_HEAD_SHA}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate lockfile from approved dependency set
        run: npm install --package-lock-only

      - name: Commit repository-native lockfile only when changed
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1 && git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already committed and current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: commit W01 dependency lockfile"
          git push origin "HEAD:${HEAD_BRANCH}"
