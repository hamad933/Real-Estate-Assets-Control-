name: W01 validation

on:
  pull_request:
    branches:
      - governance/rp04-gov-init-001
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: lint-typecheck-build-playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Playwright authorization and visual tests
        run: npm run test:e2e

      - name: Upload W01 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rp04-w01-evidence
          if-no-files-found: warn
          path: |
            evidence/screenshots
            playwright-report
            test-results
            package-lock.json
