name: W01 lockfile bootstrap

on:
  pull_request:
    branches:
      - governance/rp04-gov-init-001

permissions:
  contents: write

jobs:
  bootstrap-lockfile:
    if: github.event.pull_request.head.ref == 'feature/rp04-imp-w01-app-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact bootstrap head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ACTUAL_HEAD_SHA="$(git rev-parse HEAD)"
          echo "Expected bootstrap SHA: ${EXPECTED_HEAD_SHA}"
          echo "Checked out bootstrap SHA: ${ACTUAL_HEAD_SHA}"
          test "${ACTUAL_HEAD_SHA}" = "${EXPECTED_HEAD_SHA}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate lockfile from approved dependency set
        run: npm install --package-lock-only

      - name: Restore final exact-head validation workflow
        run: |
          cat > .github/workflows/w01-validation.yml <<'EOF'
          name: W01 validation

          on:
            pull_request:
              branches:
                - governance/rp04-gov-init-001
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            validate:
              name: lint-typecheck-build-playwright
              runs-on: ubuntu-latest
              timeout-minutes: 20

              steps:
                - name: Checkout exact PR head
                  if: github.event_name == 'pull_request'
                  uses: actions/checkout@v4
                  with:
                    ref: ${{ github.event.pull_request.head.sha }}

                - name: Checkout dispatched ref
                  if: github.event_name == 'workflow_dispatch'
                  uses: actions/checkout@v4
                  with:
                    ref: ${{ github.sha }}

                - name: Verify exact validated SHA
                  env:
                    EXPECTED_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
                  run: |
                    ACTUAL_HEAD_SHA="$(git rev-parse HEAD)"
                    echo "Expected head SHA: ${EXPECTED_HEAD_SHA}"
                    echo "Validated head SHA: ${ACTUAL_HEAD_SHA}"
                    test "${ACTUAL_HEAD_SHA}" = "${EXPECTED_HEAD_SHA}"
                    mkdir -p evidence
                    printf '%s\n' "${ACTUAL_HEAD_SHA}" > evidence/validated-head-sha.txt

                - name: Set up Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: 22

                - name: Install dependencies from committed lockfile
                  run: npm ci

                - name: Audit dependencies
                  run: npm audit --audit-level=high

                - name: Install Playwright Chromium
                  run: npx playwright install --with-deps chromium

                - name: Lint
                  run: npm run lint

                - name: Typecheck
                  run: npm run typecheck

                - name: Production build
                  run: npm run build

                - name: Playwright authorization and visual tests
                  run: npm run test:e2e

                - name: Upload W01 evidence
                  if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: rp04-w01-evidence
                    if-no-files-found: warn
                    path: |
                      evidence/validated-head-sha.txt
                      evidence/screenshots
                      playwright-report
                      test-results
                      package-lock.json
          EOF

      - name: Commit repository-native lockfile and final workflow
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/w01-validation.yml
          git commit -m "chore: commit W01 dependency lockfile"
          git push origin "HEAD:${HEAD_BRANCH}"
