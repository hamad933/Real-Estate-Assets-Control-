name: W02 authorized photo asset bootstrap

on:
  push:
    branches:
      - feature/rp04-imp-w02-public-discovery-inquiry

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout W02 branch
        uses: actions/checkout@v4
        with:
          ref: feature/rp04-imp-w02-public-discovery-inquiry
          fetch-depth: 0

      - name: Materialize authorized photographic asset
        run: |
          mkdir -p public/assets/rp04/properties
          cat .asset-bootstrap/chunk-*.txt | base64 -d > public/assets/rp04/properties/property-sprite.webp
          test "$(stat -c%s public/assets/rp04/properties/property-sprite.webp)" -gt 50000
          printf 'RIFF' | cmp -n 4 - public/assets/rp04/properties/property-sprite.webp

      - name: Remove bootstrap-only material
        run: |
          rm -rf .asset-bootstrap
          rm .github/workflows/w02-photo-bootstrap.yml

      - name: Commit repository-native RP04 photographic asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add authorized RP04 property photography"
          git push origin HEAD:feature/rp04-imp-w02-public-discovery-inquiry
