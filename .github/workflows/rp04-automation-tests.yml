name: RP04 Automation Foundation Tests
on:
  pull_request:
    paths: ['tools/rp04_automation/**','tests/test_rp04_*.py','.github/workflows/rp04-automation-*.yml','docs/automation/**','scripts/jules/**']
  push:
    branches-ignore: [main]
    paths: ['tools/rp04_automation/**','tests/test_rp04_*.py','.github/workflows/rp04-automation-*.yml','docs/automation/**','scripts/jules/**']
permissions: {contents: read}
concurrency:
  group: rp04-automation-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '3.12'}
      - run: python -m compileall -q tools/rp04_automation tests/test_rp04_automation.py tests/test_rp04_publication.py tests/test_rp04_workflows.py
      - run: python -m unittest -v tests.test_rp04_automation tests.test_rp04_publication tests.test_rp04_workflows
      - run: bash -n scripts/jules/rp04-jules-setup.sh
